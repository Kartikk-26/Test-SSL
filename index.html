<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1, p {
            margin-bottom: 1rem;
        }
        footer {
            text-align: center;
            padding: 1rem 0;
            background-color: #333;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Simple HTML Page</h1>
</header>

<div class="container">
    <h2>About This Page</h2>
    <p>This is a basic webpage created using HTML and CSS. It has a header, content section, and footer.</p>
    
    <h3>Features:</h3>
    <ul>
        <li>Responsive Design</li>
        <li>Minimalistic Layout</li>
        <li>Clean Code</li>
    </ul>
</div>

<footer>
    <p>&copy; 2025 My Simple Page. All rights reserved.</p>
</footer>

</body>
</html>
